<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>
*{box-sizing:border-box}body{margin:0;background:#061a4b;color:#fff;font:17px Arial}main{max-width:560px;margin:auto;padding:22px}h1{font-size:25px}section{background:#fff;color:#142742;border-radius:16px;padding:20px;margin:18px 0}input,textarea,button{width:100%;padding:14px;font:inherit;border-radius:9px;margin:7px 0;border:1px solid #aeb9c7}button{background:#1459a4;color:white;cursor:pointer}button:disabled{opacity:.5}video{width:100%;background:#111;border-radius:10px}#result{white-space:pre-line;line-height:1.5;padding:18px;border-radius:12px}.paid{background:#c7f1d3}.pending{background:#fff2b3}.entered{background:#e0e5ec}[hidden]{display:none!important}#message{white-space:pre-line}label{display:block;margin-top:12px}.secondary{background:#526174}
</style><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script></head><body><main><h1>Liderazgo Celular · Escáner QR</h1><p>Cámara en vivo · RAV</p><p>Acceso exclusivo para encargados.</p>
<section id="login"><form id="loginForm"><label>Usuario<input id="user" autocomplete="username" required></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label><button id="loginButton">Iniciar sesión</button></form></section>
<section id="scanner" hidden><p id="who"></p><button id="cameraButton" type="button">Abrir cámara</button><video id="video" playsinline muted hidden></video><button id="stopButton" class="secondary" type="button" hidden>Cerrar cámara</button><label>Leer QR desde una foto<input id="photo" type="file" accept="image/*"></label><form id="searchForm"><label>O escribir número de registro<input id="registrationId" placeholder="RAV-12345678" required autocomplete="off"></label><button id="searchButton">Consultar registro</button></form><div id="result" hidden></div><div id="actions" hidden><label id="reasonLabel" hidden>Motivo de ingreso con pago pendiente<textarea id="reason" maxlength="300" placeholder="Mínimo 10 caracteres"></textarea></label><button id="confirmButton" type="button">Confirmar ingreso del grupo completo</button></div><button id="logoutButton" class="secondary" type="button">Cerrar sesión</button></section><p id="message" role="status" aria-live="polite"></p><canvas id="canvas" hidden></canvas></main>
<script>
'use strict';
const $=id=>document.getElementById(id);let token='',current=null,stream=null,raf=null,busy=false;
function message(s){$('message').textContent=s;}
const APP_URL='https://script.google.com/macros/s/AKfycbwoaNdvQc8n94SHUtYbm5D_lAPo6fV1RZT6bS4k1_KqfxpBxeRkVu4h374FnIWWqQeZig/exec';
const nonce=Array.from(crypto.getRandomValues(new Uint8Array(24)),x=>x.toString(16).padStart(2,'0')).join('');
let bridgeWindow=null,bridgeOrigin='',bridgeReady=false;
const pending=new Map();
const trustedOrigin=o=>{try{const u=new URL(o);return u.protocol==='https:'&&(u.hostname==='script.google.com'||u.hostname.endsWith('.googleusercontent.com'));}catch(e){return false;}};
window.addEventListener('message',e=>{
 const d=e.data;if(!d||d.channel!=='rav-lc-bridge'||d.nonce!==nonce||!trustedOrigin(e.origin))return;
 if(d.type==='ready'&&!bridgeWindow){bridgeWindow=e.source;bridgeOrigin=e.origin;bridgeReady=true;message('Conexión lista. Inicia sesión.');return;}
 if(e.source!==bridgeWindow||e.origin!==bridgeOrigin)return;
 const request=pending.get(d.requestId);if(!request)return;clearTimeout(request.timer);pending.delete(d.requestId);d.ok?request.resolve(d.result):request.reject(new Error(d.error||'Error de conexión.'));
});
const bridge=document.createElement('iframe');bridge.hidden=true;bridge.title='Conexión privada de registros';bridge.src=APP_URL+'?bridge=1&nonce='+encodeURIComponent(nonce);document.body.appendChild(bridge);
message('Conectando con los registros…');setTimeout(()=>{if(!bridgeReady)message('No se pudo conectar. Verifica que publicaste el nuevo PuenteLiderazgo y doGet; después recarga.');},20000);
function rpc(name,args){return new Promise((resolve,reject)=>{
 if(!bridgeReady){reject(new Error('La conexión todavía no está lista. Espera unos segundos o recarga.'));return;}
 const requestId=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();
 const timer=setTimeout(()=>{pending.delete(requestId);reject(new Error('Tiempo de espera agotado. Consulta de nuevo antes de repetir un ingreso.'));},45000);
 pending.set(requestId,{resolve,reject,timer});bridgeWindow.postMessage({channel:'rav-lc-bridge',nonce:nonce,requestId:requestId,name:name,args:args},bridgeOrigin);
});}
function stop(){if(raf)cancelAnimationFrame(raf);raf=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;$('video').hidden=true;$('stopButton').hidden=true;}
function clearResult(){current=null;$('result').hidden=true;$('actions').hidden=true;$('reason').value='';}
async function search(id){
 if(busy)return;busy=true;stop();clearResult();$('searchButton').disabled=true;message('Consultando…');
 try{const r=await rpc('liderazgoQrBuscar',[token,id]);current=r;$('registrationId').value=r.id;
 $('result').className=r.entered?'entered':r.payment==='Pagado'?'paid':'pending';
 $('result').textContent=(r.entered?'YA INGRESÓ':r.payment==='Pagado'?'🟢 PAGADO':'🟡 PENDIENTE')+'\nRegistro: '+r.id+'\nResponsable: '+r.responsible+'\nParticipantes: '+r.names.join('\n')+'\nPersonas: '+r.people;
 $('result').hidden=false;$('actions').hidden=r.entered;$('reasonLabel').hidden=r.payment==='Pagado';message(r.entered?'Este registro ya fue utilizado.':'Verifica los nombres antes de confirmar el ingreso del grupo completo.');
 }catch(e){message(e.message);}finally{busy=false;$('searchButton').disabled=false;}
}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginButton').disabled=true;message('Iniciando sesión…');try{const r=await rpc('liderazgoQrLogin',[$('user').value,$('password').value]);token=r.token;$('password').value='';$('who').textContent='Encargado: '+r.username;$('login').hidden=true;$('scanner').hidden=false;message('Listo para consultar registros.');}catch(e){message(e.message);}finally{$('loginButton').disabled=false;}};
$('searchForm').onsubmit=e=>{e.preventDefault();search($('registrationId').value);};
$('stopButton').onclick=stop;
$('cameraButton').onclick=async()=>{stop();clearResult();try{
 if(!bridgeReady)throw new Error('Espera a que termine la conexión con los registros.');
 if(typeof jsQR!=='function')throw new Error('No cargó el lector QR. Recarga o escribe el ID.');
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Cámara no disponible. Usa una foto o escribe el ID.');
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=stream;$('video').hidden=false;$('stopButton').hidden=false;await $('video').play();message('Apunta al QR.');
 let last=0;function frame(time){if(!stream)return;const v=$('video'),c=$('canvas');if(time-last>250&&v.readyState>=2){last=time;c.width=Math.min(v.videoWidth,1000);c.height=Math.round(v.videoHeight*c.width/v.videoWidth);const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(v,0,0,c.width,c.height);const pixels=ctx.getImageData(0,0,c.width,c.height);const code=jsQR(pixels.data,c.width,c.height,{inversionAttempts:'attemptBoth'});if(code){search(code.data);return;}}raf=requestAnimationFrame(frame);}raf=requestAnimationFrame(frame);
 }catch(e){stop();message('No se pudo abrir la cámara: '+e.message+' Puedes usar una foto o escribir el ID.');}};
$('photo').onchange=async e=>{const file=e.target.files[0];if(!file)return;stop();clearResult();let url;try{if(typeof jsQR!=='function')throw new Error('No cargó el lector QR. Escribe el ID.');url=URL.createObjectURL(file);const img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(new Error('No se pudo abrir la foto. Usa JPG o PNG.'));img.src=url;});const c=$('canvas'),scale=Math.min(1,1800/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,c.width,c.height);const pixels=ctx.getImageData(0,0,c.width,c.height);const code=jsQR(pixels.data,c.width,c.height,{inversionAttempts:'attemptBoth'});if(!code)throw new Error('No se encontró QR. Usa una foto más cercana o escribe el ID.');await search(code.data);}catch(e){message(e.message);}finally{if(url)URL.revokeObjectURL(url);$('photo').value='';}};
$('confirmButton').onclick=async()=>{if(!current||busy)return;const r=current,reason=$('reason').value.trim();if(r.payment!=='Pagado'&&reason.length<10){message('Escribe un motivo de excepción de al menos 10 caracteres.');return;}if(!confirm('¿Confirmar el ingreso de las '+r.people+' persona(s) de este registro?'))return;busy=true;$('confirmButton').disabled=true;try{await rpc('liderazgoQrConfirmar',[token,r.id,reason]);busy=false;await search(r.id);}catch(e){clearResult();message(e.message+' Consulta nuevamente el registro antes de repetir.');}finally{busy=false;$('confirmButton').disabled=false;}};
$('logoutButton').onclick=async()=>{stop();const old=token;token='';clearResult();$('scanner').hidden=true;$('login').hidden=false;message('Sesión cerrada.');try{await rpc('liderazgoQrLogout',[old]);}catch(e){}};
window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
</script></body></html>
