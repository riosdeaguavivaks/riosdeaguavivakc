<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administrador Galería RAV</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#17323e}header{background:#02152f;color:#fff;padding:12px 18px;position:sticky;top:0;z-index:9}.top{max-width:1200px;margin:auto;display:flex;align-items:center;gap:12px}.top img{width:52px;height:52px;object-fit:contain}.brand{flex:1;font-weight:900}.lang button{border:0;padding:8px 11px;font-weight:900;border-radius:8px}.active{background:#fff;color:#063f92}main{max-width:1200px;margin:auto;padding:25px 18px}.hero{background:linear-gradient(135deg,#063f92,#02152f);color:#fff;border-radius:18px;padding:22px;display:flex;justify-content:space-between;align-items:center}.primary{background:#168ee8!important;color:#fff}.yellow{background:#ffbd20!important;color:#102030}.danger{background:#b42318!important;color:#fff}button,.pick{border:0;border-radius:9px;padding:11px 13px;font-weight:900;cursor:pointer}.notice{margin:17px 0;background:#e9f5ff;border-left:5px solid #168ee8;padding:13px;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 6px 20px #0002}.card img{width:100%;height:180px;object-fit:contain;background:#fff;cursor:pointer}.openhint{display:block;width:100%;border:0;border-radius:0;background:#063f92;color:#fff;padding:11px;font-weight:900;cursor:pointer}.card .b{padding:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.overlay{display:none;position:fixed;inset:0;background:#000a;z-index:20;padding:15px;align-items:center;justify-content:center}.overlay.open{display:flex}.modal{background:#fff;border-radius:18px;padding:20px;width:min(950px,100%);max-height:92vh;overflow:auto}label{display:block;font-weight:900;margin:13px 0 6px}input[type=text]{width:100%;padding:12px;border:1px solid #ccd6df;border-radius:9px}input[type=file]{display:none}.files{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.previews,.published{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:13px}.pic{position:relative;background:#eef3f7;border-radius:10px;overflow:hidden}.pic img{width:100%;height:135px;object-fit:cover}.x{position:absolute;right:5px;top:5px;background:#b42318;color:#fff;padding:7px}.modalActions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.status{font-weight:900;margin-top:12px}.small{color:#687d87;font-size:.9rem}.busy{opacity:.55;pointer-events:none}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.previews,.published{grid-template-columns:repeat(3,1fr)}}@media(max-width:580px){.grid{grid-template-columns:1fr}.previews,.published{grid-template-columns:repeat(2,1fr)}.hero{display:block}.hero button{margin-top:12px;width:100%}}

.adminGate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(145deg,#031c42,#063f92)}
.adminGateBox{width:min(500px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:0 20px 60px #0006;text-align:center}
.adminGateBox h1{margin-top:0;color:#063f92}.adminGateBox input{display:block;width:100%;padding:14px;border:1px solid #b8c8d5;border-radius:10px;font-size:1rem;margin:14px 0 12px}
.adminGateBox>button{width:100%;background:#063f92;color:#fff;padding:14px}.gateErr{min-height:22px;margin-top:10px;color:#b00020;font-weight:800}
.gateMenu{display:none;gap:14px;margin-top:20px}.gateMenu a{display:block;text-decoration:none;padding:18px;border-radius:12px;font-weight:900;color:#fff}.gateEv{background:#063f92}.gateGa{background:#07975f}
</style></head><body>
<div id="adminGate" class="adminGate"><div class="adminGateBox">
  <div id="gateLogin">
    <h1>🔐 Administrador RAV</h1><p>Introduce la contraseña para continuar.</p>
    <input id="gatePassword" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button type="button" onclick="galleryAdminLogin()">ENTRAR</button>
    <div id="gateErr" class="gateErr"></div>
  </div>
  <div id="gateMenu" class="gateMenu">
    <h1>Administración RAV</h1><p>Selecciona lo que deseas administrar.</p>
    <a class="gateEv" href="admin-eventos.html">📅 ADMINISTRAR EVENTOS</a>
    <a class="gateGa" href="#" onclick="enterGallery();return false;">📸 ADMINISTRAR GALERÍA</a>
  </div>
</div></div>

<header><div class="top"><img src="ravofficial.png"><div class="brand" data-es="ADMINISTRADOR DE GALERÍA RAV" data-en="RAV GALLERY ADMIN">ADMINISTRADOR DE GALERÍA RAV</div><div class="lang"><button id="es" onclick="setLang('es')">ES</button><button id="en" onclick="setLang('en')">EN</button></div></div></header>
<main><div class="hero"><div><h1 data-es="Álbumes de fotografías" data-en="Photo Albums">Álbumes de fotografías</h1><span data-es="Crea álbumes y administra fotografías." data-en="Create albums and manage photos.">Crea álbumes y administra fotografías.</span></div><button class="yellow" onclick="createAlbum()" data-es="＋ CREAR NUEVO ÁLBUM" data-en="＋ CREATE NEW ALBUM">＋ CREAR NUEVO ÁLBUM</button></div>

<div id="cards" class="grid"></div></main>
<div id="ov" class="overlay"><div class="modal"><h2 id="mt"></h2><div id="mc"></div><div id="ma" class="modalActions"></div><div id="st" class="status"></div></div></div>
<script>
const ENDPOINT="https://script.google.com/macros/s/AKfycbwFiDih2S_UUJnhOlX05a-fyjuAACO6V1eicgRROCNBcL0trOr27S9zCqH4FrC7w9x0fw/exec";
const API="https://api.github.com/repos/riosdeaguavivaks/Galeria-Rav/contents/";
let lang=localStorage.getItem("ravGalleryAdminLanguage")||"es", selected=[], cover=null, current=null;
const legacy=[
{slug:"25-aniversario-pastoral",tituloEs:"25° Aniversario Pastoral",tituloEn:"25th Pastoral Anniversary",basePath:"eventos/25-aniversario-pastoral/",portada:"portada.png"},
{slug:"servicios",tituloEs:"Servicios",tituloEn:"Services",basePath:"eventos/servicios/",portada:"portada.jpg"},
{slug:"bautismos",tituloEs:"Bautismos",tituloEn:"Baptisms",basePath:"eventos/bautismos/",portada:"portada.jpg"},
{slug:"Praise team",tituloEs:"Praise Team",tituloEn:"Praise Team",basePath:"eventos/Praise team/",portada:"portada.png"},
{slug:"Ministerio Infantil",tituloEs:"Ministerio Infantil",tituloEn:"Children’s Ministry",basePath:"eventos/Ministerio Infantil/",portada:"portada.png"},
{slug:"escuela-biblica-de-vacaciones-vbs",tituloEs:"Escuela Bíblica de Vacaciones (VBS)",tituloEn:"Vacation Bible School (VBS)",basePath:"eventos/escuela-biblica-de-vacaciones-vbs/",portada:"portada.png"},
{slug:"que-significan-estas-piedras",tituloEs:"¿Qué significan estas piedras?",tituloEn:"What Do These Stones Mean?",basePath:"eventos/que-significan-estas-piedras/",portada:"portada.jpg"},
{slug:"Ministerio Hadassa",tituloEs:"Ministerio Hadassa",tituloEn:"Hadassa Ministry",basePath:"eventos/Ministerio Hadassa/",portada:"portada.jpg"}];
let albums=[];
function t(a,b){return lang==="es"?a:b} function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function setLang(v){lang=v;localStorage.setItem("ravGalleryAdminLanguage",v);document.querySelectorAll("[data-es]").forEach(x=>x.textContent=x.dataset[v]);es.classList.toggle("active",v==="es");en.classList.toggle("active",v==="en");render()}
async function loadAlbums(){try{const r=await fetch("galeria-albumes.json?_="+Date.now(),{cache:"no-store"});const extra=r.ok?await r.json():[];albums=[...legacy,...(Array.isArray(extra)?extra:[])];}catch(e){albums=[...legacy]}render()}
function render(){cards.innerHTML=albums.map((a,i)=>`<article class="card"><img onclick="openAlbum(${i})" src="${esc(a.basePath+a.portada)}?v=${Date.now()}" alt="${esc(lang==="es"?a.tituloEs:(a.tituloEn||a.tituloEs))}"><div class="b"><h3>${esc(lang==="es"?a.tituloEs:(a.tituloEn||a.tituloEs))}</h3></div><button class="openhint" onclick="openAlbum(${i})">${t("📸 TOCAR PORTADA PARA ADMINISTRAR","📸 TAP COVER TO MANAGE")}</button></article>`).join("")}
function show(title,content,actions=""){mt.textContent=title;mc.innerHTML=content;ma.innerHTML=actions;st.textContent="";ov.classList.add("open")} function closeM(){selected.forEach(x=>URL.revokeObjectURL(x.url));selected=[];cover=null;current=null;ov.classList.remove("open")}
function createAlbum(){selected=[];cover=null;show(t("Crear nuevo álbum","Create new album"),`<p class="small">${t("Primero crea el álbum con su portada. Después toca la portada para entrar y subir las fotografías.","First create the album with its cover. Then tap the cover to enter and upload photos.")}</p><label>${t("Nombre en español","Spanish name")}</label><input id="nes" type="text"><label>${t("Nombre en inglés","English name")}</label><input id="nen" type="text"><label>${t("Portada del álbum","Album cover")}</label><div class="files"><label class="pick primary" for="cov">${t("📁 SELECCIONAR PORTADA","📁 SELECT COVER")}</label><span id="covn" class="small">${t("Ninguna seleccionada","None selected")}</span></div><input id="cov" type="file" accept="image/*" onchange="pickCover(this)">`,`<button class="primary" onclick="saveNew()">${t("💾 CREAR ÁLBUM","💾 CREATE ALBUM")}</button><button onclick="closeM()">${t("❌ CANCELAR","❌ CANCEL")}</button>`)}
function pickCover(x){cover=x.files[0]||null;covn.textContent=cover?cover.name:t("Ninguna seleccionada","None selected")}
function pickPhotos(x){for(const f of x.files)if(f.type.startsWith("image/"))selected.push({file:f,url:URL.createObjectURL(f)});x.value="";drawPrev()}
function drawPrev(){phn.textContent=selected.length?t(selected.length+" seleccionada(s)",selected.length+" selected"):"";prev.innerHTML=selected.map((x,i)=>`<div class="pic"><img src="${x.url}"><button class="x" onclick="rm(${i})">🗑️</button></div>`).join("")}
function rm(i){URL.revokeObjectURL(selected[i].url);selected.splice(i,1);drawPrev()}
async function webp(file,q=.84){const bmp=await createImageBitmap(file);let w=bmp.width,h=bmp.height,m=Math.min(1,1920/Math.max(w,h));w=Math.round(w*m);h=Math.round(h*m);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(bmp,0,0,w,h);const blob=await new Promise(r=>c.toBlob(r,"image/webp",q));return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)})}
async function post(data){await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});return true}
async function saveNew(){const ne=nes.value.trim(),nn=nen.value.trim()||ne;if(!ne||!cover){st.textContent=t("⚠️ Escribe el nombre y selecciona portada.","⚠️ Enter a name and select a cover.");return}try{ov.classList.add("busy");st.textContent=t("⏳ Optimizando y publicando...","⏳ Optimizing and publishing...");const cb=await webp(cover,.88);await post({accion:"galeriaCrearAlbum",tituloEs:ne,tituloEn:nn,portadaBase64:cb,fotos:[]});st.textContent=t("✅ Enviado. Espera unos segundos mientras GitHub publica el álbum.","✅ Sent. Wait a few seconds while GitHub publishes the album.");setTimeout(()=>{closeM();loadAlbums()},7000)}catch(e){st.textContent="⚠️ "+e.message}finally{ov.classList.remove("busy")}}
async function listFiles(a){const r=await fetch(API+a.basePath.replace(/^\/+/,""),{cache:"no-store"});if(!r.ok)throw new Error("GitHub "+r.status);return (await r.json()).filter(x=>x.type==="file"&&/\.(jpg|jpeg|png|webp)$/i.test(x.name)&&!/^portada\./i.test(x.name))}
async function openAlbum(i){current=albums[i];show(lang==="es"?current.tituloEs:(current.tituloEn||current.tituloEs),`<div class="actions"><button class="primary" onclick="document.getElementById('add').click()">${t("＋ SUBIR FOTOGRAFÍAS","＋ UPLOAD PHOTOS")}</button><button onclick="changeCover(${i})">${t("🖼️ CAMBIAR PORTADA","🖼️ CHANGE COVER")}</button>${i>=legacy.length?`<button class="danger" onclick="deleteAlbum(${i})">${t("🗑️ ELIMINAR ÁLBUM","🗑️ DELETE ALBUM")}</button>`:""}</div><input id="add" type="file" accept="image/*" multiple onchange="addPhotos(this)"><p class="small">${t("Cada fotografía publicada tiene su botón 🗑️ para eliminar solamente esa foto.","Each published photo has its own 🗑️ button to delete only that photo.")}</p><div id="pub" class="published"><div class="small">${t("Cargando...","Loading...")}</div></div>`,`<button onclick="closeM()">${t("← REGRESAR A ÁLBUMES","← BACK TO ALBUMS")}</button>`);try{const f=await listFiles(current);pub.innerHTML=f.length?f.map(x=>`<div class="pic"><img src="${x.download_url}"><button class="x" title="${t("Eliminar foto","Delete photo")}" onclick="delPhoto('${encodeURIComponent(x.name)}')">🗑️</button></div>`).join(""):`<div class="small">${t("No hay fotografías todavía.","No photos yet.")}</div>`}catch(e){pub.innerHTML=`<div class="small">⚠️ ${esc(e.message)}</div>`}}
async function addPhotos(x){if(!current)return;try{ov.classList.add("busy");st.textContent=t("⏳ Optimizando y subiendo...","⏳ Optimizing and uploading...");const fs=[];for(let i=0;i<x.files.length;i++)fs.push({nombre:`foto-${Date.now()}-${i+1}.webp`,base64:await webp(x.files[i])});await post({accion:"galeriaAgregarFotos",slug:current.slug,fotos:fs});st.textContent=t("✅ Fotografías enviadas.","✅ Photos sent.");setTimeout(()=>openAlbum(albums.indexOf(current)),6000)}catch(e){st.textContent="⚠️ "+e.message}finally{ov.classList.remove("busy")}}
async function delPhoto(enc){if(!current)return;const n=decodeURIComponent(enc);if(!confirm(t("¿Eliminar esta fotografía?","Delete this photo?")))return;await post({accion:"galeriaEliminarFoto",slug:current.slug,nombre:n});st.textContent=t("✅ Eliminación enviada.","✅ Delete sent.");setTimeout(()=>openAlbum(albums.indexOf(current)),5000)}
function changeCover(i){current=albums[i];show(t("Cambiar portada","Change cover"),`<label>${t("Nueva portada","New cover")}</label><div class="files"><label class="pick primary" for="newc">${t("📁 SELECCIONAR PORTADA","📁 SELECT COVER")}</label></div><input id="newc" type="file" accept="image/*" onchange="cover=this.files[0]">`,`<button class="primary" onclick="saveCover()">${t("💾 GUARDAR","💾 SAVE")}</button><button onclick="closeM()">${t("CANCELAR","CANCEL")}</button>`)}
async function saveCover(){if(!current||!cover){st.textContent=t("Selecciona una portada.","Select a cover.");return}ov.classList.add("busy");st.textContent=t("⏳ Guardando...","⏳ Saving...");await post({accion:"galeriaCambiarPortada",slug:current.slug,portadaBase64:await webp(cover,.88)});ov.classList.remove("busy");st.textContent="✅";setTimeout(()=>{closeM();loadAlbums()},5000)}
async function deleteAlbum(i){const a=albums[i];if(i<legacy.length)return;if(!confirm(t(`¿Eliminar el álbum “${a.tituloEs}” y todas sus fotos?`,`Delete album “${a.tituloEn||a.tituloEs}” and all its photos?`)))return;await post({accion:"galeriaEliminarAlbum",slug:a.slug});setTimeout(loadAlbums,6000)}

const RAV_ADMIN_HASH="e48aef90727fc8eb772cf89b590d8fe7cbb98a4b4fcc2ce55da78f0ffc915a8c";
async function gateHash(s){const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,"0")).join("")}
async function galleryAdminLogin(){
  if(await gateHash(gatePassword.value)===RAV_ADMIN_HASH){
    sessionStorage.setItem("ravAdminUnlocked","1");
    gateLogin.style.display="none";gateMenu.style.display="grid";gateErr.textContent="";
  }else{gateErr.textContent="Contraseña incorrecta.";gatePassword.value="";gatePassword.focus()}
}
function enterGallery(){adminGate.style.display="none"}
gatePassword.addEventListener("keydown",e=>{if(e.key==="Enter")galleryAdminLogin()});
if(sessionStorage.getItem("ravAdminUnlocked")==="1")adminGate.style.display="none";
ov.addEventListener("click",e=>{if(e.target===ov)closeM()});setLang(lang);loadAlbums();

</script></body></html>
