<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#180500"><title>Aviva El Fuego 2026 | Rekindle The Fire</title><meta name="description" content="Cuenta regresiva para Aviva El Fuego / Rekindle The Fire 2026. Jueves 12 de noviembre, 7:00 PM, Kansas City."><meta property="og:type" content="website"><meta property="og:title" content="Aviva El Fuego / Rekindle The Fire 2026"><meta property="og:description" content="¡Mira la cuenta regresiva y regístrate para la conferencia!"><meta property="og:url" content="https://riosdeaguavivaks.com/aviva-el-fuego/"><meta property="og:image" content="https://riosdeaguavivaks.com/aviva-el-fuego/aviva-logo-es.png"><meta property="og:image:width" content="1672"><meta property="og:image:height" content="470"><style>*{box-sizing:border-box}body{margin:0;color:#fff;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(ellipse at 50% 10%,#6e1c08 0,#230600 42%,#090303 85%);min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:22px 16px 50px}.top{display:flex;justify-content:flex-end;gap:10px}.lang{background:#270c05;border:1px solid #ff982b;color:white;border-radius:25px;padding:10px 17px;cursor:pointer;font-weight:bold}.lang[aria-pressed=true]{background:#a83a0b}.hero{display:block;width:min(100%,1020px);margin:12px auto 22px;filter:drop-shadow(0 0 18px #e65319)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{border:2px solid #ff8c13;border-radius:25px;background:linear-gradient(145deg,#3b0d04,#100302 65%);box-shadow:0 0 18px #b7340c,inset 0 0 20px #712009;padding:24px 15px;text-align:center}.panel h2{color:#ffc65d;font-size:clamp(24px,3vw,38px);margin:0 0 8px;text-shadow:0 0 10px #e64c00}.date{font-size:clamp(15px,2vw,21px);font-weight:bold}.time{color:#ffbb63;font-size:25px;font-weight:bold;margin:9px}.digits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:18px 0 6px}.unit{min-width:0}.num{background:linear-gradient(#551200,#180502);border:2px solid #ff971f;border-radius:13px;box-shadow:0 0 11px #ff5a00;color:#ffe4a3;font-size:clamp(24px,4vw,58px);font-weight:900;font-variant-numeric:tabular-nums;padding:12px 1px;text-shadow:0 0 9px #ff9500}.unit small{display:block;font-size:clamp(10px,1.2vw,15px);margin-top:9px;font-weight:bold}.status{min-height:22px;color:#ffcf83;font-weight:bold}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:30px 0}.btn{display:inline-block;text-align:center;border:1px solid #ffb04a;background:#4a1809;color:white;border-radius:14px;padding:15px 25px;font-weight:bold;font-size:17px;cursor:pointer;text-decoration:none}.primary{background:linear-gradient(#f45b0a,#9e1600);box-shadow:0 0 16px #b8330c}.btn:disabled{opacity:.45;cursor:not-allowed}.note{text-align:center;color:#f3c8a7;font-size:13px}@media(max-width:720px){.grid{grid-template-columns:1fr}.panel{padding:20px 10px}.num{font-size:clamp(26px,8vw,52px)}.unit small{font-size:11px}.hero{margin-top:16px}}</style></head><body><main class="wrap"><div class="top"><button class="lang" id="es" aria-pressed="true">Español</button><button class="lang" id="en" aria-pressed="false">English</button></div><img class="hero" id="logo" src="aviva-logo-es.png" alt="Aviva El Fuego — Conferencia de Predicación 2026"><div class="grid"><section class="panel"><h2 data-es="INICIO DEL EVENTO" data-en="EVENT START">INICIO DEL EVENTO</h2><div class="date" data-es="JUEVES 12 DE NOVIEMBRE DE 2026" data-en="THURSDAY, NOVEMBER 12, 2026">JUEVES 12 DE NOVIEMBRE DE 2026</div><div class="time">7:00 PM</div><div class="digits" id="event"></div><div class="status" id="event-status"></div></section><section class="panel"><h2 data-es="REGISTRACIONES" data-en="REGISTRATIONS">REGISTRACIONES</h2><div class="date" data-es="JUEVES 12 DE NOVIEMBRE DE 2026" data-en="THURSDAY, NOVEMBER 12, 2026">JUEVES 12 DE NOVIEMBRE DE 2026</div><div class="time">12:00 PM</div><div class="digits" id="registration"></div><div class="status" id="registration-status"></div></section></div><div class="actions"><a class="btn primary" id="register" href="https://riosdeaguavivaks.com/" data-es="REGÍSTRATE AHORA" data-en="REGISTER NOW">REGÍSTRATE AHORA</a><button class="btn" id="share" data-es="COMPARTIR" data-en="SHARE">COMPARTIR</button><button class="btn" id="copy" data-es="COPIAR ENLACE" data-en="COPY LINK">COPIAR ENLACE</button></div><p class="note" data-es="Horario de Kansas City (CST). Comparte esta página para ver los contadores en vivo." data-en="Kansas City time (CST). Share this page to see the live countdowns.">Horario de Kansas City (CST). Comparte esta página para ver los contadores en vivo.</p></main><script>
// CONFIGURACIÓN: reemplaza esta URL con el enlace real de registro existente.
const REGISTRATION_URL='https://riosdeaguavivaks.com/';
const EVENT_DATE=Date.parse('2026-11-12T19:00:00-06:00');
const REGISTRATION_DATE=Date.parse('2026-11-12T12:00:00-06:00');
let language=new URLSearchParams(location.search).get('lang')==='en'?'en':'es';
const translations={es:['DÍAS','HORAS','MIN','SEG'],en:['DAYS','HOURS','MIN','SEC']};
function renderTimer(id,deadline){const remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));const v=[Math.floor(remaining/86400),Math.floor(remaining%86400/3600),Math.floor(remaining%3600/60),remaining%60];document.getElementById(id).innerHTML=v.map((n,i)=>`<div class="unit"><div class="num">${String(n).padStart(2,'0')}</div><small>${translations[language][i]}</small></div>`).join('');return remaining;}
function tick(){const event=renderTimer('event',EVENT_DATE),reg=renderTimer('registration',REGISTRATION_DATE);document.getElementById('event-status').textContent=event?'':language==='es'?'¡EL EVENTO HA COMENZADO!':'THE EVENT HAS STARTED!';document.getElementById('registration-status').textContent=reg?'':language==='es'?'REGISTRACIONES FINALIZADAS':'REGISTRATIONS ENDED';const button=document.getElementById('register');button.style.display=reg?'inline-block':'none';}
function setLanguage(lang){language=lang;document.documentElement.lang=lang;document.getElementById('logo').src=`aviva-logo-${lang}.png`;document.getElementById('logo').alt=lang==='es'?'Aviva El Fuego — Conferencia de Predicación 2026':'Rekindle The Fire — Preaching Conference 2026';document.querySelectorAll('[data-es][data-en]').forEach(el=>el.textContent=el.dataset[lang]);for(const x of ['es','en'])document.getElementById(x).setAttribute('aria-pressed',String(x===lang));tick();}
document.getElementById('register').href=REGISTRATION_URL;document.getElementById('es').onclick=()=>setLanguage('es');document.getElementById('en').onclick=()=>setLanguage('en');document.getElementById('share').onclick=async()=>{const url=location.href;if(navigator.share){try{await navigator.share({title:document.title,url})}catch(e){}}else{window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url),'_blank','noopener')}};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);alert(language==='es'?'Enlace copiado':'Link copied')}catch(e){prompt('Copy link',location.href)}};setLanguage(language);setInterval(tick,1000);
</script></body></html>
