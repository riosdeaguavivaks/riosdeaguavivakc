name: RAV YouTube LIVE

on:
  workflow_dispatch:

  # GitHub Actions usa UTC. Este rango cubre las dos ventanas
  # dominicales tanto en horario de verano como de invierno.
  # El paso "Check Kansas City time" filtra las horas exactas.
  schedule:
    - cron: "*/5 14-18 * * 0"

permissions:
  contents: write

concurrency:
  group: rav-live-status
  cancel-in-progress: true

jobs:
  check-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Kansas City time
        id: time_window
        shell: bash
        run: |
          python3 <<'PY'
          import os
          from datetime import datetime, time
          from zoneinfo import ZoneInfo

          local_now = datetime.now(ZoneInfo("America/Chicago"))
          current = local_now.time()
          is_sunday = local_now.weekday() == 6
          in_first = time(9, 50) <= current <= time(10, 30, 59)
          in_second = time(11, 50) <= current <= time(12, 30, 59)
          is_manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          should_run = is_manual or (is_sunday and (in_first or in_second))
          print("Kansas City:", local_now.isoformat())
          print("YouTube check enabled:", should_run)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={'true' if should_run else 'false'}\n")
          PY

      - name: Detect RAV YouTube LIVE
