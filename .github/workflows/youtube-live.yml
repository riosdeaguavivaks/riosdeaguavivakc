name: RAV YouTube LIVE

on:
  # Permite ejecutar una prueba manual desde GitHub Actions
  workflow_dispatch:

  # Revisa automáticamente cada 10 minutos,
  # todos los días, las 24 horas.
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: rav-live-status
  cancel-in-progress: true

jobs:
  check-live:
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # 1. DESCARGAR REPOSITORIO
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. REVISAR SI RAV ESTÁ LIVE EN YOUTUBE
      # =====================================================
      - name: Check YouTube LIVE
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          api_key = os.environ.get("YOUTUBE_API_KEY", "").strip()

          # Canal oficial RAV
          handle = "riosdeaguavivaks1087"

          if not api_key:
              raise RuntimeError(
                  "YOUTUBE_API_KEY no está configurada en GitHub Secrets."
              )

          # =================================================
          # FUNCIÓN PARA CONSULTAR YOUTUBE API
          # =================================================
          def get_json(base_url, params):
              url = base_url + "?" + urllib.parse.urlencode(params)

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "RAV-Live-Checker"}
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:
                      return json.loads(
                          response.read().decode("utf-8")
                      )

              except urllib.error.HTTPError as e:
                  body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print("====================================")
                  print("YOUTUBE API HTTP ERROR")
                  print("HTTP STATUS:", e.code)
                  print(body)
                  print("====================================")

                  raise

              except Exception as e:
                  print("====================================")
                  print("ERROR CONSULTANDO YOUTUBE")
                  print(type(e).__name__)
                  print(str(e))
                  print("====================================")

                  raise

          print("====================================")
          print("RAV YOUTUBE LIVE CHECK")
          print("Canal:", handle)
          print("====================================")

          # =================================================
          # 3. OBTENER CHANNEL ID
          # =================================================
          channel_data = get_json(
              "https://www.googleapis.com/youtube/v3/channels",
              {
                  "part": "id",
                  "forHandle": handle,
                  "key": api_key
              }
          )

          items = channel_data.get("items", [])

          if not items:
              print("No se encontró el canal usando el handle.")
              print(json.dumps(channel_data, indent=2))

              raise RuntimeError(
                  "No se pudo encontrar el canal de YouTube."
              )

          channel_id = items[0]["id"]

          print("Channel ID:", channel_id)

          # =================================================
          # 4. BUSCAR TRANSMISIÓN ACTUALMENTE LIVE
          # =================================================
          live_data = get_json(
              "https://www.googleapis.com/youtube/v3/search",
              {
                  "part": "id",
                  "channelId": channel_id,
                  "eventType": "live",
                  "type": "video",
                  "maxResults": 5,
                  "key": api_key
              }
          )

          live_items = live_data.get("items", [])

          youtube_live = len(live_items) > 0
          youtube_video_id = ""

          # Obtener ID del video que está LIVE
          if youtube_live:
              youtube_video_id = (
                  live_items[0]
                  .get("id", {})
                  .get("videoId", "")
              )

          print("------------------------------------")
          print("YouTube LIVE:", youtube_live)
          print("Videos LIVE encontrados:", len(live_items))

          if youtube_live:
              print("LIVE VIDEO ID:", youtube_video_id)
          else:
              print("No hay transmisión LIVE actualmente.")

          print("------------------------------------")

          # =================================================
          # 5. CREAR live-status.json
          # =================================================
          new_status = {
              "youtube": youtube_live,
              "facebook": False
          }

          # Si existe un LIVE, guardar también el ID del video.
          if youtube_live and youtube_video_id:
              new_status["youtubeVideoId"] = youtube_video_id

          with open(
              "live-status.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  new_status,
                  f,
                  indent=2
              )

              # Nueva línea al final del archivo
              f.write("\n")

          print("Nuevo live-status.json:")
          print(
              json.dumps(
                  new_status,
                  indent=2
              )
          )

          print("====================================")

          PY

      # =====================================================
      # 6. GUARDAR EL NUEVO ESTADO EN GITHUB
      # =====================================================
      - name: Save LIVE status
        run: |
          git config user.name "RAV Live Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live-status.json

          if git diff --cached --quiet; then
            echo "LIVE status has not changed."
            exit 0
          fi

          git commit -m "Update YouTube LIVE status"
          git push
