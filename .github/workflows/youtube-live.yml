name: RAV YouTube LIVE

on:
  workflow_dispatch:

  # Revisión automática cada 10 minutos
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: rav-live-status
  cancel-in-progress: true

jobs:
  check-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check YouTube LIVE
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          API_KEY = os.environ.get("YOUTUBE_API_KEY", "").strip()
          HANDLE = "riosdeaguavivaks1087"

          if not API_KEY:
              raise RuntimeError(
                  "YOUTUBE_API_KEY no está configurada."
              )

          def youtube_api(endpoint, params):
              params["key"] = API_KEY

              url = (
                  "https://www.googleapis.com/youtube/v3/"
                  + endpoint
                  + "?"
                  + urllib.parse.urlencode(params)
              )

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "RAV-Live-Checker"}
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      return json.loads(
                          response.read().decode("utf-8")
                      )

              except urllib.error.HTTPError as e:
                  body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print("YOUTUBE API ERROR")
                  print("HTTP:", e.code)
                  print(body)

                  raise


          print("====================================")
          print("RAV YOUTUBE LIVE CHECK")
          print("Canal:", HANDLE)
          print("====================================")


          # ================================================
          # 1. OBTENER CHANNEL ID
          # ================================================

          channel_data = youtube_api(
              "channels",
              {
                  "part": "id",
                  "forHandle": HANDLE
              }
          )

          channel_items = channel_data.get("items", [])

          if not channel_items:
              raise RuntimeError(
                  "No se encontró el canal RAV."
              )

          channel_id = channel_items[0]["id"]

          print("Channel ID:", channel_id)


          # ================================================
          # 2. BUSCAR VIDEOS RECIENTES DEL CANAL
          #
          # No dependemos solamente de eventType=live.
          # ================================================

          search_data = youtube_api(
              "search",
              {
                  "part": "id,snippet",
                  "channelId": channel_id,
                  "type": "video",
                  "order": "date",
                  "maxResults": 10
              }
          )

          video_ids = []

          for item in search_data.get("items", []):
              video_id = (
                  item
                  .get("id", {})
                  .get("videoId", "")
              )

              if video_id:
                  video_ids.append(video_id)


          print(
              "Videos recientes encontrados:",
              len(video_ids)
          )


          # ================================================
          # 3. CONSULTAR ESTADO REAL DE LOS VIDEOS
          # ================================================

          youtube_live = False
          youtube_video_id = ""

          if video_ids:

              videos_data = youtube_api(
                  "videos",
                  {
                      "part": "snippet,liveStreamingDetails,status",
                      "id": ",".join(video_ids)
                  }
              )

              for video in videos_data.get("items", []):

                  video_id = video.get("id", "")

                  snippet = video.get(
                      "snippet",
                      {}
                  )

                  live_details = video.get(
                      "liveStreamingDetails",
                      {}
                  )

                  broadcast_content = snippet.get(
                      "liveBroadcastContent",
                      "none"
                  )

                  actual_start = live_details.get(
                      "actualStartTime"
                  )

                  actual_end = live_details.get(
                      "actualEndTime"
                  )

                  title = snippet.get(
                      "title",
                      ""
                  )

                  print("------------------------------------")
                  print("VIDEO:", video_id)
                  print("TITLE:", title)
                  print(
                      "liveBroadcastContent:",
                      broadcast_content
                  )
                  print(
                      "actualStartTime:",
                      actual_start
                  )
                  print(
                      "actualEndTime:",
                      actual_end
                  )

                  # MÉTODO 1:
                  # YouTube dice explícitamente LIVE
                  is_live_by_status = (
                      broadcast_content == "live"
                  )

                  # MÉTODO 2:
                  # La transmisión comenzó
                  # y todavía no terminó.
                  is_live_by_details = (
                      bool(actual_start)
                      and not actual_end
                  )

                  if (
                      is_live_by_status
                      or is_live_by_details
                  ):
                      youtube_live = True
                      youtube_video_id = video_id

                      print("*** LIVE DETECTADO ***")
                      break


          # ================================================
          # 4. RESULTADO
          # ================================================

          print("====================================")
          print("YouTube LIVE:", youtube_live)

          if youtube_live:
              print(
                  "LIVE VIDEO ID:",
                  youtube_video_id
              )
          else:
              print(
                  "No se detectó transmisión LIVE."
              )


          # ================================================
          # 5. CREAR live-status.json
          # ================================================

          new_status = {
              "youtube": youtube_live,
              "facebook": False
          }

          if youtube_live and youtube_video_id:
              new_status[
                  "youtubeVideoId"
              ] = youtube_video_id


          with open(
              "live-status.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  new_status,
                  f,
                  indent=2
              )

              f.write("\n")


          print("------------------------------------")
          print("Nuevo live-status.json:")
          print(
              json.dumps(
                  new_status,
                  indent=2
              )
          )
          print("====================================")

          PY


      - name: Save LIVE status
        run: |
          git config user.name "RAV Live Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live-status.json

          if git diff --cached --quiet; then
            echo "LIVE status has not changed."
            exit 0
          fi

          git commit -m "Update YouTube LIVE status"

          git pull --rebase origin main
          git push origin main
