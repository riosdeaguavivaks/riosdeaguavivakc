name: RAV YouTube LIVE

on:
  workflow_dispatch:

  # GitHub usa UTC.
  # Domingo: revisar cada 5 minutos durante la ventana de servicios.
  schedule:
    - cron: "*/5 14-21 * * 0"

permissions:
  contents: write

concurrency:
  group: rav-live-status
  cancel-in-progress: true

jobs:
  check-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check YouTube LIVE
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          api_key = os.environ.get("YOUTUBE_API_KEY", "").strip()
          handle = "riosdeaguavivaks1087"

          if not api_key:
              raise RuntimeError(
                  "YOUTUBE_API_KEY no está configurada en GitHub Secrets."
              )

          def get_json(base_url, params):
              url = base_url + "?" + urllib.parse.urlencode(params)

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "RAV-Live-Checker"}
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:
                      return json.loads(
                          response.read().decode("utf-8")
                      )

              except urllib.error.HTTPError as e:
                  body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print("====================================")
                  print("YOUTUBE API HTTP ERROR")
                  print("HTTP STATUS:", e.code)
                  print(body)
                  print("====================================")

                  raise

              except Exception as e:
                  print("====================================")
                  print("ERROR CONSULTANDO YOUTUBE")
                  print(type(e).__name__)
                  print(str(e))
                  print("====================================")

                  raise

          print("====================================")
          print("RAV YOUTUBE LIVE CHECK")
          print("Canal:", handle)
          print("====================================")

          # -------------------------------------------------
          # 1. OBTENER CHANNEL ID
          # -------------------------------------------------

          channel_data = get_json(
              "https://www.googleapis.com/youtube/v3/channels",
              {
                  "part": "id",
                  "forHandle": handle,
                  "key": api_key
              }
          )

          items = channel_data.get("items", [])

          if not items:
              print("No se encontró el canal usando el handle.")
              print(json.dumps(channel_data, indent=2))

              raise RuntimeError(
                  "No se pudo encontrar el canal de YouTube."
              )

          channel_id = items[0]["id"]

          print("Channel ID:", channel_id)

          # -------------------------------------------------
          # 2. BUSCAR TRANSMISIÓN LIVE
          # -------------------------------------------------

          live_data = get_json(
              "https://www.googleapis.com/youtube/v3/search",
              {
                  "part": "id",
                  "channelId": channel_id,
                  "eventType": "live",
                  "type": "video",
                  "maxResults": 5,
                  "key": api_key
              }
          )

          live_items = live_data.get("items", [])

          youtube_live = len(live_items) > 0

          print("------------------------------------")
          print("YouTube LIVE:", youtube_live)
          print("Videos LIVE encontrados:", len(live_items))

          if youtube_live:
              for item in live_items:
                  video_id = item.get(
                      "id",
                      {}
                  ).get(
                      "videoId",
                      ""
                  )

                  print(
                      "LIVE VIDEO:",
                      video_id
                  )

          print("------------------------------------")

          # -------------------------------------------------
          # 3. GUARDAR ESTADO
          #
          # YouTube controla la leyenda LIVE de RAV.
          # Facebook NO controla este indicador.
          # -------------------------------------------------

          new_status = {
              "youtube": youtube_live,
              "facebook": False
          }

          with open(
              "live-status.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  new_status,
                  f,
                  indent=2
              )

          print("Nuevo live-status.json:")
          print(
              json.dumps(
                  new_status,
                  indent=2
              )
          )

          print("====================================")

          PY

      - name: Save LIVE status
        run: |
          git config user.name "RAV Live Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live-status.json

          if git diff --cached --quiet; then
            echo "LIVE status has not changed."
            exit 0
          fi

          git commit -m "Update YouTube LIVE status"
          git push
