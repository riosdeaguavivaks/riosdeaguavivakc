name: RAV YouTube LIVE

on:
  workflow_dispatch:

  # GitHub usa UTC.
  # Durante el domingo revisamos con frecuencia.
  schedule:
    - cron: "*/5 14-21 * * 0"

permissions:
  contents: write

concurrency:
  group: rav-youtube-live
  cancel-in-progress: true

jobs:
  check-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check YouTube LIVE
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          api_key = os.environ["YOUTUBE_API_KEY"]
          handle = "riosdeaguavivaks1087"

          def get_json(base_url, params):
              url = base_url + "?" + urllib.parse.urlencode(params)

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "RAV-Live-Checker"}
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          # Obtener el Channel ID automáticamente
          channel_data = get_json(
              "https://www.googleapis.com/youtube/v3/channels",
              {
                  "part": "id",
                  "forHandle": handle,
                  "key": api_key
              }
          )

          items = channel_data.get("items", [])

          if not items:
              raise RuntimeError(
                  "No se pudo encontrar el canal de YouTube."
              )

          channel_id = items[0]["id"]

          # Buscar únicamente transmisiones que estén LIVE ahora mismo
          live_data = get_json(
              "https://www.googleapis.com/youtube/v3/search",
              {
                  "part": "id",
                  "channelId": channel_id,
                  "eventType": "live",
                  "type": "video",
                  "maxResults": 1,
                  "key": api_key
              }
          )

          youtube_live = len(live_data.get("items", [])) > 0

          # Conservar el estado de Facebook para agregarlo después
          facebook_live = False

          try:
              with open("live-status.json", "r", encoding="utf-8") as f:
                  old_status = json.load(f)
                  facebook_live = bool(
                      old_status.get("facebook", False)
                  )
          except Exception:
              pass

          new_status = {
              "youtube": youtube_live,
              "facebook": facebook_live
          }

          with open(
              "live-status.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(new_status, f, indent=2)

          print("YouTube LIVE:", youtube_live)
          print("Channel ID:", channel_id)

          PY

      - name: Save LIVE status
        run: |
          git config user.name "RAV Live Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live-status.json

          if git diff --cached --quiet; then
            echo "LIVE status has not changed."
            exit 0
          fi

          git commit -m "Update YouTube LIVE status"
          git push
