name: RAV YouTube LIVE

on:
  workflow_dispatch:

  # Revisión automática cada 10 minutos
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: rav-live-status
  cancel-in-progress: true

jobs:
  check-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect RAV YouTube LIVE
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          API_KEY = os.environ.get("YOUTUBE_API_KEY", "").strip()

          HANDLE = "riosdeaguavivaks1087"

          if not API_KEY:
              raise RuntimeError(
                  "YOUTUBE_API_KEY no está configurada."
              )

          def youtube_api(endpoint, params):

              params["key"] = API_KEY

              url = (
                  "https://www.googleapis.com/youtube/v3/"
                  + endpoint
                  + "?"
                  + urllib.parse.urlencode(params)
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "RAV-Live-Checker"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      return json.loads(
                          response.read().decode("utf-8")
                      )

              except urllib.error.HTTPError as e:

                  body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print("====================================")
                  print("YOUTUBE API ERROR")
                  print("HTTP STATUS:", e.code)
                  print(body)
                  print("====================================")

                  raise


          print("====================================")
          print("RAV AUTOMATIC YOUTUBE LIVE CHECK")
          print("Canal:", HANDLE)
          print("====================================")


          # =================================================
          # 1. OBTENER EL CHANNEL ID
          # =================================================

          channel_data = youtube_api(
              "channels",
              {
                  "part": "id,contentDetails",
                  "forHandle": HANDLE
              }
          )

          channel_items = channel_data.get(
              "items",
              []
          )

          if not channel_items:

              raise RuntimeError(
                  "No se encontró el canal RAV."
              )

          channel = channel_items[0]

          channel_id = channel["id"]

          uploads_playlist = (
              channel
              .get("contentDetails", {})
              .get("relatedPlaylists", {})
              .get("uploads", "")
          )

          print("Channel ID:", channel_id)
          print(
              "Uploads playlist:",
              uploads_playlist
          )


          # =================================================
          # 2. CREAR LISTA DE CANDIDATOS
          # =================================================
          #
          # Usamos DOS métodos:
          #
          # A) búsqueda específica de LIVE
          # B) playlist de uploads del canal
          #
          # Así no dependemos de una sola búsqueda.
          # =================================================

          candidate_ids = []


          # -------------------------------------------------
          # MÉTODO A:
          # BUSCAR LIVE DIRECTAMENTE
          # -------------------------------------------------

          try:

              live_search = youtube_api(
                  "search",
                  {
                      "part": "id",
                      "channelId": channel_id,
                      "eventType": "live",
                      "type": "video",
                      "maxResults": 10
                  }
              )

              for item in live_search.get(
                  "items",
                  []
              ):

                  video_id = (
                      item
                      .get("id", {})
                      .get("videoId", "")
                  )

                  if (
                      video_id
                      and video_id not in candidate_ids
                  ):
                      candidate_ids.append(
                          video_id
                      )

          except Exception as e:

              print(
                  "Búsqueda LIVE no disponible:",
                  str(e)
              )


          print(
              "Candidatos después de búsqueda LIVE:",
              len(candidate_ids)
          )


          # -------------------------------------------------
          # MÉTODO B:
          # REVISAR ÚLTIMOS VIDEOS DE LA PLAYLIST UPLOADS
          # -------------------------------------------------

          if uploads_playlist:

              uploads_data = youtube_api(
                  "playlistItems",
                  {
                      "part": "contentDetails",
                      "playlistId": uploads_playlist,
                      "maxResults": 25
                  }
              )

              for item in uploads_data.get(
                  "items",
                  []
              ):

                  video_id = (
                      item
                      .get("contentDetails", {})
                      .get("videoId", "")
                  )

                  if (
                      video_id
                      and video_id not in candidate_ids
                  ):
                      candidate_ids.append(
                          video_id
                      )


          print(
              "Total de videos candidatos:",
              len(candidate_ids)
          )


          # =================================================
          # 3. CONSULTAR EL ESTADO REAL DE LOS VIDEOS
          # =================================================

          youtube_live = False
          youtube_video_id = ""


          if candidate_ids:

              # videos.list permite varios IDs en una consulta
              videos_data = youtube_api(
                  "videos",
                  {
                      "part": (
                          "snippet,"
                          "liveStreamingDetails,"
                          "status"
                      ),
                      "id": ",".join(
                          candidate_ids[:50]
                      )
                  }
              )

              for video in videos_data.get(
                  "items",
                  []
              ):

                  video_id = video.get(
                      "id",
                      ""
                  )

                  snippet = video.get(
                      "snippet",
                      {}
                  )

                  details = video.get(
                      "liveStreamingDetails",
                      {}
                  )

                  title = snippet.get(
                      "title",
                      ""
                  )

                  live_content = snippet.get(
                      "liveBroadcastContent",
                      "none"
                  )

                  actual_start = details.get(
                      "actualStartTime"
                  )

                  actual_end = details.get(
                      "actualEndTime"
                  )

                  concurrent_viewers = details.get(
                      "concurrentViewers"
                  )


                  print("------------------------------------")
                  print("VIDEO:", video_id)
                  print("TITLE:", title)
                  print(
                      "liveBroadcastContent:",
                      live_content
                  )
                  print(
                      "actualStartTime:",
                      actual_start
                  )
                  print(
                      "actualEndTime:",
                      actual_end
                  )
                  print(
                      "concurrentViewers:",
                      concurrent_viewers
                  )


                  # =========================================
                  # DETECCIÓN REAL DE LIVE
                  # =========================================

                  live_by_status = (
                      live_content == "live"
                  )

                  live_by_times = (
                      bool(actual_start)
                      and not actual_end
                  )


                  if (
                      live_by_status
                      or live_by_times
                  ):

                      youtube_live = True
                      youtube_video_id = video_id

                      print("")
                      print(
                          "*** LIVE RAV DETECTADO ***"
                      )
                      print(
                          "VIDEO ID:",
                          youtube_video_id
                      )
                      print("")

                      break


          # =================================================
          # 4. RESULTADO
          # =================================================

          print("====================================")
          print(
              "YouTube LIVE:",
              youtube_live
          )

          if youtube_live:

              print(
                  "LIVE VIDEO ID:",
                  youtube_video_id
              )

          else:

              print(
                  "No hay transmisión LIVE."
              )

          print("====================================")


          # =================================================
          # 5. CREAR live-status.json
          # =================================================

          new_status = {
              "youtube": youtube_live,
              "facebook": False
          }


          if (
              youtube_live
              and youtube_video_id
          ):

              new_status[
                  "youtubeVideoId"
              ] = youtube_video_id


          with open(
              "live-status.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  new_status,
                  f,
                  indent=2
              )

              f.write("\n")


          print("")
          print("Nuevo live-status.json:")

          print(
              json.dumps(
                  new_status,
                  indent=2
              )
          )

          print("====================================")

          PY


      - name: Save LIVE status
        run: |
          git config user.name "RAV Live Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live-status.json

          if git diff --cached --quiet; then
            echo "LIVE status has not changed."
            exit 0
          fi

          git commit -m "Update YouTube LIVE status"

          git pull --rebase origin main
          git push origin main
