name: RAV YouTube LIVE

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: rav-live-status
  cancel-in-progress: true

jobs:
  check-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check YouTube LIVE
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          API_KEY = os.environ.get("YOUTUBE_API_KEY", "").strip()

          # =================================================
          # PRUEBA DIRECTA DEL LIVE ACTUAL DE RAV
          # =================================================
          VIDEO_ID = "FpZpt0kzR-c"

          if not API_KEY:
              raise RuntimeError(
                  "YOUTUBE_API_KEY no está configurada."
              )

          def youtube_api(endpoint, params):
              params["key"] = API_KEY

              url = (
                  "https://www.googleapis.com/youtube/v3/"
                  + endpoint
                  + "?"
                  + urllib.parse.urlencode(params)
              )

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "RAV-Live-Checker"}
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:
                      return json.loads(
                          response.read().decode("utf-8")
                      )

              except urllib.error.HTTPError as e:
                  body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print("====================================")
                  print("YOUTUBE API ERROR")
                  print("HTTP STATUS:", e.code)
                  print(body)
                  print("====================================")

                  raise

          print("====================================")
          print("RAV YOUTUBE LIVE - DIRECT TEST")
          print("VIDEO ID:", VIDEO_ID)
          print("====================================")

          # =================================================
          # CONSULTAR DIRECTAMENTE EL VIDEO LIVE
          # =================================================
          video_data = youtube_api(
              "videos",
              {
                  "part": "snippet,liveStreamingDetails,status",
                  "id": VIDEO_ID
              }
          )

          items = video_data.get("items", [])

          youtube_live = False
          youtube_video_id = ""

          if not items:
              print("YouTube no devolvió información del video.")

          else:
              video = items[0]

              snippet = video.get("snippet", {})
              live_details = video.get(
                  "liveStreamingDetails",
                  {}
              )

              title = snippet.get("title", "")

              broadcast_content = snippet.get(
                  "liveBroadcastContent",
                  "none"
              )

              actual_start = live_details.get(
                  "actualStartTime"
              )

              actual_end = live_details.get(
                  "actualEndTime"
              )

              scheduled_start = live_details.get(
                  "scheduledStartTime"
              )

              concurrent_viewers = live_details.get(
                  "concurrentViewers"
              )

              print("TITLE:", title)
              print(
                  "liveBroadcastContent:",
                  broadcast_content
              )
              print(
                  "scheduledStartTime:",
                  scheduled_start
              )
              print(
                  "actualStartTime:",
                  actual_start
              )
              print(
                  "actualEndTime:",
                  actual_end
              )
              print(
                  "concurrentViewers:",
                  concurrent_viewers
              )

              # =============================================
              # DETECCIÓN LIVE
              # =============================================

              is_live_by_status = (
                  broadcast_content == "live"
              )

              is_live_by_details = (
                  bool(actual_start)
                  and not actual_end
              )

              if (
                  is_live_by_status
                  or is_live_by_details
              ):
                  youtube_live = True
                  youtube_video_id = VIDEO_ID

                  print("====================================")
                  print("*** LIVE DETECTADO ***")
                  print("====================================")

              else:
                  print("====================================")
                  print("VIDEO NO DETECTADO COMO LIVE")
                  print("====================================")

          # =================================================
          # CREAR live-status.json
          # =================================================

          new_status = {
              "youtube": youtube_live,
              "facebook": False
          }

          if youtube_live and youtube_video_id:
              new_status["youtubeVideoId"] = (
                  youtube_video_id
              )

          with open(
              "live-status.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  new_status,
                  f,
                  indent=2
              )

              f.write("\n")

          print("")
          print("====================================")
          print("RESULTADO FINAL")
          print("YouTube LIVE:", youtube_live)
          print("")
          print("Nuevo live-status.json:")
          print(
              json.dumps(
                  new_status,
                  indent=2
              )
          )
          print("====================================")

          PY

      - name: Save LIVE status
        run: |
          git config user.name "RAV Live Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live-status.json

          if git diff --cached --quiet; then
            echo "LIVE status has not changed."
            exit 0
          fi

          git commit -m "Update YouTube LIVE status"

          git pull --rebase origin main
          git push origin main
