name: RAV Facebook LIVE

on:
  workflow_dispatch:

  # Revisa Facebook cada 5 minutos los domingos.
  schedule:
    - cron: "*/5 14-21 * * 0"

permissions:
  contents: write

concurrency:
  group: rav-live-status
  cancel-in-progress: true

jobs:
  check-facebook-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Facebook LIVE
        env:
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}

        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error
          import sys

          token = os.environ.get("FACEBOOK_ACCESS_TOKEN", "")

          if not token:
              print("ERROR: FACEBOOK_ACCESS_TOKEN is missing.")
              sys.exit(1)

          params = {
              "fields": "status,broadcast_start_time",
              "access_token": token
          }

          url = (
              "https://graph.facebook.com/v26.0/me/live_videos?"
              + urllib.parse.urlencode(params)
          )

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "RAV-Live-Checker"}
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.loads(
                      response.read().decode("utf-8")
                  )

          except urllib.error.HTTPError as error:
              print("FACEBOOK GRAPH API ERROR")
              print("HTTP status:", error.code)

              try:
                  error_body = error.read().decode("utf-8")
                  error_json = json.loads(error_body)

                  fb_error = error_json.get("error", {})

                  print("Facebook message:",
                        fb_error.get("message", "Unknown error"))

                  print("Facebook error type:",
                        fb_error.get("type", "Unknown"))

                  print("Facebook error code:",
                        fb_error.get("code", "Unknown"))

                  print("Facebook error subcode:",
                        fb_error.get("error_subcode", "None"))

              except Exception:
                  print("Could not decode Facebook error response.")

              sys.exit(1)

          except Exception as error:
              print("GENERAL ERROR:", str(error))
              sys.exit(1)

          videos = result.get("data", [])

          facebook_live = any(
              str(video.get("status", "")).upper() == "LIVE"
              for video in videos
          )

          youtube_live = False

          try:
              with open(
                  "live-status.json",
                  "r",
                  encoding="utf-8"
              ) as f:
                  old_status = json.load(f)
                  youtube_live = bool(
                      old_status.get("youtube", False)
                  )
          except Exception:
              pass

          new_status = {
              "youtube": youtube_live,
              "facebook": facebook_live
          }

          with open(
              "live-status.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(new_status, f, indent=2)

          print("Facebook LIVE:", facebook_live)
          print("Videos returned:", len(videos))
          PY

      - name: Save LIVE status
        run: |
          git config user.name "RAV Live Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live-status.json

          if git diff --cached --quiet; then
            echo "Facebook LIVE status has not changed."
            exit 0
          fi

          git commit -m "Update Facebook LIVE status"
          git pull --rebase
          git push
