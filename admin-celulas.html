<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061a4b">
<title>Administrar Células | RAV</title>
<link rel="icon" type="image/png" href="rav-icon.png?v=3">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef4f8;color:#17323e}
header{background:linear-gradient(135deg,#02152f,#063f92);color:#fff;padding:20px}
.top{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(1.5rem,4vw,2.3rem)}.sub{opacity:.82;margin-top:5px}
.top a,.top button{border:0;border-radius:10px;padding:11px 14px;font-weight:900;text-decoration:none;cursor:pointer}
.back{background:#fff;color:#063f92}.logout{background:#b3261e;color:#fff}
main{max-width:1180px;margin:auto;padding:24px 15px 60px}
.notice{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:18px;box-shadow:0 4px 15px rgba(0,0,0,.07)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.card{background:#fff;border:1px solid #dce6ec;border-radius:17px;padding:18px;box-shadow:0 7px 22px rgba(0,0,0,.07);cursor:pointer}
.card:hover{transform:translateY(-2px)}.card h2{margin:0;color:#063f92}.counts{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.badge{padding:6px 9px;border-radius:999px;font-size:.78rem;font-weight:900;background:#eef2f5}.new{background:#fff1bf}.seen{background:#e8f2ff}.contacted{background:#dff6e9}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:50;padding:18px;overflow:auto}.modal.open{display:block}
.box{max-width:850px;margin:25px auto;background:#f7fbff;border-radius:20px;padding:20px;position:relative}
.close{position:absolute;right:12px;top:10px;border:0;border-radius:50%;width:38px;height:38px;background:#031c42;color:#fff;font-size:24px}
.msg{background:#fff;border-left:5px solid #8aa0ad;border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.msg.is-new{border-left-color:#e0a800}.msg.is-contacted{border-left-color:#07975f}.msg h3{margin:0 0 5px}.date{font-size:.8rem;color:#687d87}.contact{margin:8px 0;font-weight:800}.body{white-space:pre-wrap;margin:10px 0}
.states{display:flex;gap:7px;flex-wrap:wrap}.states button{border:1px solid #cad8e1;background:#eef3f6;border-radius:9px;padding:8px 10px;font-weight:900;cursor:pointer}.states button.active{background:#063f92;color:#fff}
.empty{text-align:center;padding:25px;color:#687d87;font-weight:800}
.admin-tools{margin:15px 0 20px;padding:15px;background:#eef5fb;border-radius:14px;border:1px solid #d5e4ee}
.admin-tools h3{margin:0 0 8px;color:#063f92}.admin-tools textarea{width:100%;min-height:105px;resize:vertical;border:1px solid #b9cbd6;border-radius:10px;padding:11px;font:inherit}
.tool-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:9px}.save-note,.unlock-leader{border:0;border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer}.save-note{background:#063f92;color:#fff}.unlock-leader{background:#fff1bf;color:#533c00;border:1px solid #e1c45c}.note-meta{font-size:.78rem;color:#687d87}.tool-status{font-size:.85rem;font-weight:800}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="top"><div><h1>🏠 Administrar Células</h1><div class="sub">Mensajes de las 9 Células</div></div><div><a class="back" href="index.html">← Administración RAV</a> <button class="logout" onclick="logout()">Cerrar sesión</button></div></div></header>
<main>
<div class="notice" id="status">Cargando mensajes…</div>
<div class="grid" id="cellsGrid"></div>
</main>
<div class="modal" id="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><h2 id="modalTitle"></h2>
<div class="admin-tools"><h3>📝 Notas de la Célula</h3><textarea id="cellNote" maxlength="5000" placeholder="Escribe aquí información interna para Administración..."></textarea><div class="tool-row"><button class="save-note" onclick="saveNote()">💾 Guardar nota</button><button class="unlock-leader" onclick="unlockLeader()">🔓 Desbloquear acceso del líder</button><span class="tool-status" id="toolStatus"></span></div><div class="note-meta" id="noteMeta"></div></div>
<div id="messages"></div></div></div>
<script>
const FORM_URL='https://script.google.com/macros/s/AKfycby2cKVztUAU8ET7OqK_tUyfrDC1jjS6RwGh35tTSjCHKkfM7VCNnets3NvQqt624pvc/exec';
const IDLE=5*60*1000; let timer=null, allData={}, allNotes={}, currentCell='';
function logout(){sessionStorage.removeItem('ravAdminUnlocked');sessionStorage.removeItem('ravAdminPassword');sessionStorage.removeItem('ravAdminLastActivity');sessionStorage.removeItem('ravAdminToken');location.href='index.html';}
function valid(){const last=Number(sessionStorage.getItem('ravAdminLastActivity')||0);return sessionStorage.getItem('ravAdminUnlocked')==='1'&&!!sessionStorage.getItem('ravAdminPassword')&&last&&Date.now()-last<=IDLE}
function touch(){if(!valid())return logout();sessionStorage.setItem('ravAdminLastActivity',String(Date.now()));clearTimeout(timer);timer=setTimeout(logout,IDLE)}
['click','keydown','touchstart','input'].forEach(e=>document.addEventListener(e,touch,{passive:true}));
if(!valid()) logout(); else touch();
async function post(p){const r=await fetch(FORM_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});return JSON.parse(await r.text())}
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(v){const d=new Date(v);return isNaN(d)?safe(v):d.toLocaleString('es-US',{dateStyle:'medium',timeStyle:'short'})}
async function loadAll(){
 const pw=sessionStorage.getItem('ravAdminPassword'), grid=document.getElementById('cellsGrid'); grid.innerHTML='';
 try{
  const results=await Promise.all([...Array(9)].map((_,i)=>post({tipo:'area_lider_listar',celula:String(i+1),password:pw})));
  results.forEach((d,i)=>{if(!d.success)throw new Error(d.message||'Acceso denegado');allData[i+1]=d.mensajes||[]});
  const nd=await post({tipo:'admin_celula_notas_listar',password:pw});if(nd.success)allNotes=nd.notas||{};
  renderCards();document.getElementById('status').textContent='Panel actualizado. Toca una Célula para ver sus mensajes.';
 }catch(e){document.getElementById('status').textContent='No se pudo abrir el panel. Verifica CELULAS_ADMIN_PASSWORD.';}
}
function renderCards(){
 const grid=document.getElementById('cellsGrid');
 grid.innerHTML=[...Array(9)].map((_,i)=>{const n=i+1,a=allData[n]||[];const c=s=>a.filter(x=>String(x.estado||'NUEVO').toUpperCase()===s).length;
 return `<div class="card" onclick="openCell(${n})"><h2>Célula #${n}</h2><div class="counts"><span class="badge new">NUEVO ${c('NUEVO')}</span><span class="badge seen">VISTO ${c('VISTO')}</span><span class="badge contacted">CONTACTADO ${c('CONTACTADO')}</span></div></div>`}).join('');
}
function openCell(n){currentCell=String(n);document.getElementById('modalTitle').textContent='Célula #'+n;renderMessages();const x=allNotes[currentCell]||{};document.getElementById('cellNote').value=x.nota||'';document.getElementById('noteMeta').textContent=x.actualizado?'Última actualización: '+fmt(x.actualizado):'Sin notas guardadas todavía.';document.getElementById('toolStatus').textContent='';document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function renderMessages(){
 const a=allData[currentCell]||[],box=document.getElementById('messages');
 if(!a.length){box.innerHTML='<div class="empty">Todavía no hay mensajes para esta Célula.</div>';return}
 box.innerHTML=a.map(m=>{const st=String(m.estado||'NUEVO').toUpperCase(),cl=st==='NUEVO'?'is-new':st==='CONTACTADO'?'is-contacted':'';
 return `<article class="msg ${cl}"><h3>${safe(m.nombre||'Sin nombre')}</h3><div class="date">${fmt(m.fecha)}</div><div class="contact">${m.telefono?'📞 '+safe(m.telefono)+'<br>':''}${m.email?'✉️ '+safe(m.email):''}</div><div class="body">${safe(m.mensaje||'')}</div><div class="states">${['NUEVO','VISTO','CONTACTADO'].map(s=>`<button class="${st===s?'active':''}" onclick="setState('${safe(m.id)}','${s}')">${s}</button>`).join('')}</div></article>`}).join('');
}
async function setState(id,estado){const pw=sessionStorage.getItem('ravAdminPassword');const d=await post({tipo:'area_lider_estado',celula:currentCell,password:pw,id,estado});if(!d.success)return alert('No se pudo actualizar.');const r=await post({tipo:'area_lider_listar',celula:currentCell,password:pw});if(r.success){allData[currentCell]=r.mensajes||[];renderMessages();renderCards();touch()}}

async function saveNote(){
 const pw=sessionStorage.getItem('ravAdminPassword'),nota=document.getElementById('cellNote').value,st=document.getElementById('toolStatus');st.textContent='Guardando…';
 try{const d=await post({tipo:'admin_celula_nota_guardar',celula:currentCell,password:pw,nota});if(!d.success)throw new Error(d.message||'Error');allNotes[currentCell]={nota:d.nota||'',actualizado:d.actualizado||''};document.getElementById('noteMeta').textContent=d.actualizado?'Última actualización: '+fmt(d.actualizado):'';st.textContent='✓ Nota guardada';touch()}catch(e){st.textContent='No se pudo guardar la nota.'}
}
async function unlockLeader(){
 if(!confirm('¿Desbloquear el acceso del líder de la Célula #'+currentCell+'?'))return;
 const pw=sessionStorage.getItem('ravAdminPassword'),st=document.getElementById('toolStatus');st.textContent='Desbloqueando…';
 try{const d=await post({tipo:'admin_celula_desbloquear',celula:currentCell,password:pw});if(!d.success)throw new Error(d.message||'Error');st.textContent='✓ Acceso del líder desbloqueado';touch()}catch(e){st.textContent='No se pudo desbloquear.'}
}

document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
loadAll();
</script>
</body></html>
