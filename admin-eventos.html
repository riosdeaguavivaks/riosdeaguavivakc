<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAV | Administrador de Eventos</title>
<style>
body{font-family:Arial,sans-serif;background:#eef5fb;color:#17323e;margin:0;padding:24px}
.wrap{max-width:760px;margin:auto;background:#fff;padding:26px;border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.12)}
h1{color:#063f92}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-weight:800;font-size:.85rem}input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #bccbd6;border-radius:9px}
.full{grid-column:1/-1}button{border:0;border-radius:10px;padding:13px 18px;font-weight:900;cursor:pointer}
.add{background:#07975f;color:#fff}.download{background:#063f92;color:#fff}.clear{background:#eee;color:#333}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
pre{background:#071426;color:#eaf4ff;padding:15px;border-radius:12px;overflow:auto;white-space:pre-wrap}
.note{background:#fff7d6;padding:13px;border-radius:10px;line-height:1.5}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
<h1>RAV · Administrador de Eventos</h1>
<p class="note"><strong>Cómo funciona:</strong> agrega los datos del evento y el nombre exacto del flyer que subirás al repositorio. Luego descarga <strong>eventos.json</strong> y reemplaza ese archivo en GitHub. El sitio ocultará automáticamente cada evento después de su fecha final.</p>
<div class="grid">
<label>Título en español<input id="tituloEs"></label>
<label>Title in English<input id="tituloEn"></label>
<label>Fecha de inicio<input id="fechaInicio" type="date"></label>
<label>Fecha final<input id="fechaFin" type="date"></label>
<label class="full">Nombre del flyer (ej. conferencia-octubre.jpg)<input id="imagen"></label>
</div>
<div class="actions">
<button class="add" onclick="addEvent()">＋ Agregar evento</button>
<button class="download" onclick="downloadJSON()">Descargar eventos.json</button>
<button class="clear" onclick="clearEvents()">Limpiar lista</button>
</div>
<h2>Eventos preparados</h2>
<pre id="preview">[]</pre>
</div>
<script>
let events=[];
function render(){document.getElementById('preview').textContent=JSON.stringify(events,null,2)}
function addEvent(){
 const e={
  tituloEs:document.getElementById('tituloEs').value.trim(),
  tituloEn:document.getElementById('tituloEn').value.trim(),
  fechaInicio:document.getElementById('fechaInicio').value,
  fechaFin:document.getElementById('fechaFin').value,
  imagen:document.getElementById('imagen').value.trim(),
  active:true
 };
 if(!e.fechaFin||!e.imagen){alert('Agrega por lo menos la fecha final y el nombre del flyer.');return}
 events.push(e); render();
}
function clearEvents(){if(confirm('¿Limpiar la lista?')){events=[];render()}}
function downloadJSON(){
 const blob=new Blob([JSON.stringify(events,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eventos.json';a.click();URL.revokeObjectURL(a.href);
}
render();
</script>
</body>
</html>
